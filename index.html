<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B3C">
<title>Kookhulp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
<style>
:root{
  --bg:#F3F6F1;--surface:#FFFFFF;--ink:#1D2B21;--muted:#5E6B61;--line:#D6DED6;
  --basil:#2E6B3C;--basil-soft:#DCEBDD;--saffron:#F0B429;--tomato:#B83A26;
  --head:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121814;--surface:#1B231D;--ink:#E8EFE8;--muted:#9AA89C;--line:#2C3A30;
    --basil:#6FBF7E;--basil-soft:#22382A;--saffron:#E3A92A;--tomato:#E27460;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
header.top{padding:calc(22px + env(safe-area-inset-top,0px)) 0 8px}
header h1{font-family:var(--head);font-weight:700;font-size:2.1rem;line-height:1.05;margin:0;letter-spacing:-.02em}
header p{margin:6px 0 0;color:var(--muted)}
section.block{margin:22px 0}
h2{font-family:var(--head);font-weight:700;font-size:1.25rem;margin:0 0 4px}
.hint{color:var(--muted);font-size:.93rem;margin:0 0 12px}

/* niveau */
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.levels button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 0;font-family:var(--head);font-weight:700;font-size:1.3rem}
.levels button[aria-pressed=true]{background:var(--basil);border-color:var(--basil);color:#fff}
.levels button.below{border-color:var(--basil)}
.leveltext{margin:10px 0 0;padding:12px 14px;background:var(--basil-soft);border-radius:12px}

/* toggles */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.toggle .sw{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle[aria-pressed=true] .sw{background:var(--basil)}
.toggle[aria-pressed=true] .sw::after{transform:translateX(18px)}
.toggle small{display:block;color:var(--muted)}

/* borden (eters) */
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.plate{text-align:center}
.disc{margin:0 auto 8px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;box-shadow:inset 0 0 0 7px var(--bg)}
.disc span{font-family:var(--head);font-weight:700;font-size:1.6rem}
.disc.on{border-color:var(--basil);box-shadow:inset 0 0 0 7px var(--basil-soft)}
.plate .lbl{font-weight:700}
.plate .fx{color:var(--muted);font-size:.85rem}
.step{display:inline-flex;gap:6px;margin-top:8px}
.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;line-height:1}
.total{margin-top:14px;font-weight:700}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px}
.chip[aria-pressed=true]{background:var(--basil);border-color:var(--basil);color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}

/* winkel */
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.order{list-style:none;margin:0;padding:0;counter-reset:a}
.order li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;margin-bottom:6px;counter-increment:a}
.order li::before{content:counter(a);font-family:var(--head);font-weight:700;color:var(--basil);width:1.4em}
.order li span{flex:1}
.order button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.order button:disabled{opacity:.3;cursor:default}

/* recepten */
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.rec.sel{border:2px solid var(--basil);padding:13px}
.rec.off{opacity:.62}
.rec h3{font-family:var(--head);font-weight:700;font-size:1.1rem;margin:0}
.meta{color:var(--muted);font-size:.9rem;margin:2px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:.8rem;border-radius:6px;padding:2px 8px;background:var(--basil-soft)}
.tag.swap{background:color-mix(in srgb,var(--saffron) 28%,transparent)}
.why{color:var(--tomato);font-size:.9rem;margin:0}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--basil);color:#fff;font-weight:700;width:100%}
.btn.ghost{background:transparent;color:var(--basil);border:2px solid var(--basil)}
.btn.small{width:auto;padding:9px 14px}
.bar{display:flex;gap:8px;margin:14px 0}
.bar .btn{flex:1}

/* lijst */
.sec h2{font-size:1.05rem;margin:18px 0 6px;color:var(--basil)}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center;font-weight:700;color:#fff}
.item[aria-pressed=true] .box{background:var(--basil);border-color:var(--basil)}
.item[aria-pressed=true] .nm{text-decoration:line-through;color:var(--muted)}
.nm{font-weight:700}
.buy{display:block}
.sub{display:block;color:var(--muted);font-size:.85rem}
.left{color:var(--basil);font-weight:700}
.warn{color:var(--tomato)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty .btn{max-width:260px;margin-top:14px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{border:0;background:none;padding:9px 0 10px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:1.35rem;line-height:1}
nav.tabs button[aria-current=page]{color:var(--basil);font-weight:700}
.badge{background:var(--saffron);color:#1D2B21;border-radius:999px;font-size:.7rem;padding:0 6px;margin-left:2px}
/* kookmodus */
#cook{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#cook.open{display:flex}
.ck-head{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;max-width:560px;width:100%;margin:0 auto}
.ck-head h2{flex:1;margin:0;font-size:1.05rem}
.ck-x{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem}
.prog{height:6px;background:var(--line);border-radius:3px;margin:0 18px;max-width:524px;width:calc(100% - 36px);align-self:center;overflow:hidden}
.prog i{display:block;height:100%;background:var(--basil);transition:width .2s}
.ck-body{flex:1;overflow-y:auto;padding:14px 18px 20px;max-width:560px;width:100%;margin:0 auto}
.ck-n{color:var(--muted);margin:0 0 6px}
.ck-t{font-size:1.45rem;line-height:1.4;margin:0 0 16px}
.ck-t b{color:var(--basil)}
.tm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.tm div{background:var(--basil-soft);border-radius:12px;padding:10px 8px;text-align:center}
.tm small{display:block;color:var(--muted);font-size:.8rem}
.tm strong{font-family:var(--head);font-size:1.25rem}
.tm .rev{grid-column:1/-1;font-weight:700}
.tm-label{font-weight:700;margin:0 0 6px}
.uitleg{background:var(--surface);border-left:4px solid var(--saffron);border-radius:8px;padding:12px 14px;margin:0 0 16px}
details.uitleg summary{cursor:pointer;font-weight:700}
.tstart{border:2px solid var(--basil);background:var(--surface);color:var(--basil);border-radius:14px;padding:14px;width:100%;font-weight:700;font-size:1.1rem}
.timers{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 6px;max-width:560px;width:100%;margin:0 auto}
.timers:empty{display:none}
.tchip{border:0;border-radius:999px;padding:7px 12px;background:var(--ink);color:var(--bg);font-weight:700;font-variant-numeric:tabular-nums}
.tchip.done{background:var(--saffron);color:#1D2B21;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.ck-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:10px 18px 14px;max-width:560px;width:100%;margin:0 auto}
.ck-nav .btn{padding:16px;font-size:1.05rem}
.mise .item{padding:10px 12px}
.warnbox{background:color-mix(in srgb,var(--tomato) 14%,transparent);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.serve{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin:10px 0 18px}
.serve .disc{margin:0 0 4px}
.rate{display:grid;gap:8px;margin-top:10px}
.banner{background:var(--basil);color:#fff;border-radius:14px;padding:14px;margin:16px 0 0}
.banner .btn{background:#fff;color:var(--basil);margin-top:10px}
.cookbtn{margin-left:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 10px}
.seg button{border:0;background:none;border-radius:9px;padding:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--basil);color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips.scroll .chip{flex:none}
.slot{display:flex;justify-content:space-between;gap:12px;margin:8px 0;border-bottom:1px solid var(--line);padding-bottom:8px}
.slot span{color:var(--muted)}.slot strong{text-align:right}.slot em{font-weight:400;color:var(--muted)}
.zoek{position:relative;margin:0 0 10px}
.zoek input{font:inherit;color:var(--ink);width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 44px 13px 14px}
.zoek input:focus{outline:none;border-color:var(--basil)}
.zx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--muted)}
.aicard{border:2px dashed var(--basil)}
.plan{margin:6px 0 0;padding-left:1.3em}
.sub.es{font-style:italic;color:var(--basil)}.plan li{margin:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1 id="title">Kookhulp</h1><p id="sub"></p></header>

</div>

<div id="cook" role="dialog" aria-modal="true" aria-label="Kookmodus"></div>

<script>

const BLOEMKOOLRIJST={n:'Bloemkoolrijst',s:A,q:150,u:'g',pk:400};
/* q = hoeveelheid per medium portie, pk = verpakkingsgrootte (schatting, pas aan naar jouw AH) */
const RECEPTEN = [
 {id:'pesto',t:'Pasta pesto met kip',l:1,min:20,pt:2,e:['koekenpan','grote pan'],p:['olijfolie','zout','peper'],i:[
  {n:'Penne',q:100,u:'g',s:P,pk:500,gf:false,gfAlt:{n:'Glutenvrije penne',pk:500},lc:false,lcAlt:{n:'Courgetti',s:A,q:150,pk:300}},
  {n:'Kipfilet',q:100,u:'g',s:V,pk:300},

  {n:'Rucola',q:20,u:'g',s:A,pk:75}]},
 {id:'krieltjes',t:'Kip met krieltjes uit de oven',l:1,min:40,pt:0,e:['oven','ovenschaal'],p:['olijfolie','zout','peper','paprikapoeder','italiaans'],i:[

  {n:'Kipfilet',q:100,u:'g',s:V,pk:300},

/* ---------- keuken en gang (deel 3) ---------- */
const KEUKENS=['Nederlands','Indisch','Italiaans','Frans','Aziatisch','Mexicaans'];
const GANGEN=[['voor','Voorgerecht'],['hoofd','Hoofdgerecht'],['na','Nagerecht']];

/* ---------- logica ---------- */
const factor=()=>SIZES.reduce((t,z)=>t+S.eters[z.k]*z.f,0);
const eters=()=>SIZES.reduce((t,z)=>t+S.eters[z.k],0);
const kitName=k=>(APPARATEN.concat(GEREI).find(x=>x[0]===k)||[k,k])[1].toLowerCase();

function check(r){
  const why=[],swaps=[];let gvSw=false,lcSw=false;
  if(r.l>S.niveau)why.push('vanaf niveau '+r.l);
  const mist=r.e.filter(x=>!x.split('|').some(k=>S.kit[k]));
  if(mist.length)why.push('mist '+mist.map(x=>x.split('|').map(kitName).join(' of ')).join(', '));
  if(r.pt>S.pitten)why.push('heeft '+r.pt+' kookpitten nodig');
  const ing=r.i.map(x=>{
    let y=Object.assign({},x);
    if(S.gv&&y.gf===false){
      if(y.gfAlt){swaps.push(y.gfAlt.n);gvSw=true;y=Object.assign({},y,y.gfAlt,{gf:true});}
      else why.push('niet glutenvrij te maken');
    }
    if(S.lc&&y.lc===false){
      if(y.lcAlt){swaps.push(y.lcAlt.n);lcSw=true;y=Object.assign({},y,y.lcAlt,{lc:true});}
      else why.push('niet koolhydraatarm te maken');
    }
    return y;
  });
  const al=actieveAllergieen();
  if(al.length){
    const found=new Set();
    ing.forEach(x=>allergenenVan(x).forEach(a=>found.add(a)));
    r.p.forEach(p=>VOORRAAD[p]&&allergenenVan({n:VOORRAAD[p].n}).forEach(a=>found.add(a)));
    const hit=al.filter(a=>found.has(a));
    if(hit.length)why.push('bevat '+hit.map(alLabel).join(', ').toLowerCase());
  }
  return {ok:!why.length,why:[...new Set(why)],swaps,ing,gvSw,lcSw};
}

function buildList(){
  const f=factor(),m={};
  S.menu.forEach(id=>{
    const r=RECEPTEN.find(x=>x.id===id); if(!r)return;
    const c=check(r); if(!c.ok)return;
    c.ing.forEach(x=>{
      const k=x.n+'|'+x.u;
      m[k]=m[k]||{k,n:x.n,es:x.es,u:x.u,s:x.s,pk:x.pk,q:0,from:[],note:S.gv&&x.gfNote,alNote:actieveAllergieen().length>0&&SAMENGESTELD.test(norm(x.n))};
      m[k].q+=x.q*f; m[k].from.push(r.t);
    });
    r.p.forEach(p=>{
      if(S.voorraad[p])return;
      const k='V|'+p;
      m[k]=m[k]||{k,n:VOORRAAD[p].n,s:VOORRAAD[p].s,pantry:true,from:[]};
      m[k].from.push(r.t);
    });
  });
  return Object.values(m);
}

function fmtSt(q){
  const r=Math.max(q>0?0.25:0,Math.round(q*4)/4),w=Math.floor(r),fr={0:'',0.25:'¼',0.5:'½',0.75:'¾'}[r-w];
  return (w||!fr?w:'')+fr;
}
function fmt(q,u){return u==='st'?fmtSt(q)+' st':Math.round(q/5)*5+' '+u}
function buyText(x){
  if(x.pantry)return {buy:'1 verpakking',sub:'staat niet in je voorraadkast'};
  const packs=Math.max(1,Math.ceil(x.q/x.pk-1e-9)),over=packs*x.pk-x.q;
  if(x.u==='st'&&x.pk===1)return {buy:packs+(packs===1?' stuk':' stuks'),sub:fmt(x.q,'st')+' nodig',over:over>=0.25?fmtSt(over)+' over':''};
  const pack=x.u==='st'?'verpakking van '+x.pk:x.pk+' '+x.u;
  return {buy:packs+' × '+pack,sub:fmt(x.q,x.u)+' nodig',over:over>=(x.u==='st'?0.25:10)?fmt(over,x.u)+' over':''};
}

function card(r,c,btn){
  const n2=S.log.filter(x=>x.id===r.id&&x.r==='goed').length;
  const tags=[`<span class="tag">niveau ${r.l}</span>`,`<span class="tag">${r.k}</span>`,`<span class="tag">${GL[r.g]}</span>`]
    .concat(r.e.includes('thermomix')?['<span class="tag">Thermomix</span>']:[])
    .concat(r.vooraf?[`<span class="tag">vooraf: ${esc(r.vooraf)}</span>`]:[])
    .concat(n2?[`<span class="tag">${n2}× gelukt</span>`]:[])
    .concat(r.ai?['<span class="tag swap">gemaakt door Claude</span>']:[])
    .concat(c.swaps.map(s=>`<span class="tag swap">${esc(s)}</span>`)).join('');
  return `<article class="rec${btn.sel?' sel':''}${c.ok?'':' off'}">${btn.nieuw?'<p class="hint" style="color:var(--basil);font-weight:700">Nieuw recept toegevoegd</p>':''}<h3>${esc(r.t)}</h3><p class="meta">${r.min} minuten</p><div class="tags">${tags}</div>
    ${c.ok?btn.html:`<p class="why">Nu niet: ${esc(c.why.join(', '))}</p>`}</article>`;
}
function gangPlan(){
  const g=S.gangen,get=id=>RECEPTEN.find(x=>x.id===id),na=get(g.na),out=[];
  if(na&&na.vooraf)out.push(na);
  [get(g.voor),get(g.hoofd)].forEach(r=>r&&out.push(r));
  if(na&&!na.vooraf)out.push(na);
  return out.filter(r=>check(r).ok);
}

function vGangen(rs){
  const plan=gangPlan(),get=id=>RECEPTEN.find(x=>x.id===id);
  const slots=GANGEN.map(([g,l])=>{const r=get(S.gangen[g]);return `<p class="slot"><span>${l}</span><strong>${r?esc(r.t):'<em>nog niet gekozen</em>'}</strong></p>`}).join('');
  const order=plan.length?`<h3 style="margin-top:14px">Kookvolgorde</h3><ol class="plan">${plan.map(r=>`<li>${esc(r.t)}${r.vooraf?` <span class="sub">eerst, want ${esc(r.vooraf)}</span>`:''}</li>`).join('')}</ol>`:'';
  let h=`<section class="rec sel"><h3>Jouw gangenmenu</h3>${slots}${order}
    <div class="bar"><button class="btn ghost" data-act="gang-lijst"${plan.length?'':' disabled style="opacity:.5"'}>Op de boodschappenlijst</button><button class="btn" data-act="gang-kook"${plan.length?'':' disabled style="opacity:.5"'}>Kook het menu</button></div></section>`;
  GANGEN.forEach(([g,l])=>{
    const list=rs.filter(x=>x.r.g===g);
    h+=`<h2 style="margin:22px 0 8px">${l}</h2>`+(list.length?list.map(({r,c})=>{const sel=S.gangen[g]===r.id;
      return card(r,c,{sel,html:`<button class="btn small${sel?'':' ghost'}" data-act="gang" data-g="${g}" data-id="${r.id}"${pressed(sel)}>${sel?'Gekozen':'Kies als '+l.toLowerCase()}</button>`});}).join('')
      :`<p class="hint">Nog geen ${l.toLowerCase()} in deze keuken.</p>`);
  });
  return h;
}

  if(!items.length)return landBar()+`<div class="empty"><p>Nog geen gerechten gekozen. Kies in het menu wat je wilt koken, dan verschijnt hier je lijst.</p><button class="btn" data-act="tab" data-v="menu">Naar het menu</button></div>`;
  const done=items.filter(x=>S.checked[x.k]).length;
  let h=landBar()+`<p class="hint">${done} van ${items.length} in je mandje. Verpakkingen zijn schattingen.</p>`;
  curOrder().forEach(a=>{
    const g=items.filter(x=>x.s===a).sort((x,y)=>x.n.localeCompare(y.n));
    if(!g.length)return;
    h+=`<div class="sec"><h2>${esc(a)}</h2>`+g.map(x=>{const b=buyText(x);
      return `<button class="item" data-act="chk" data-k="${esc(x.k)}"${pressed(S.checked[x.k])}><span class="box">${S.checked[x.k]?'✓':''}</span>
        <span><span class="nm">${esc(x.n)}</span>${esLine(x)}<span class="buy">${b.buy}</span>
        <span class="sub">${b.sub}${b.over?', <span class="left">'+b.over+'</span>':''}</span>
        ${x.note?'<span class="sub warn">Controleer het etiket op gluten</span>':''}
        ${x.alNote?'<span class="sub warn">Controleer het etiket op allergenen</span>':''}
        <span class="sub">Voor: ${esc([...new Set(x.from)].join(', '))}</span></span></button>`}).join('')+`</div>`;
  });
  h+=`<div class="bar"><button class="btn ghost" data-act="share">Deel lijst</button><button class="btn ghost" data-act="reset">Nieuwe week</button></div>`;
  return h;
}
const SUB={ik:'Jouw niveau, eters en voeding.',keuken:'Wat er in je keuken staat.',winkel:'Waar je boodschappen doet.',
  menu:()=>'Gerechten voor '+eters()+(eters()===1?' eter':' eters')+' op niveau '+S.niveau+'.',lijst:()=>'Boodschappen bij '+curWinkel()+'.'};

function render(){
  const t=S.tab,title=TABS.find(x=>x[0]===t)[2];
  document.getElementById('title').textContent={ik:'Kookhulp',keuken:'Keuken',winkel:'Winkel',menu:'Menu',lijst:'Boodschappen'}[t]||title;
  const s=SUB[t];document.getElementById('sub').textContent=typeof s==='function'?s():s;
  document.getElementById('view').innerHTML={ik:vIk,keuken:vKeuken,winkel:vWinkel,menu:vMenu,lijst:vLijst}[t]();
  document.getElementById('tabs').innerHTML=TABS.map(([k,ic,l])=>`<button data-act="tab" data-v="${k}"${t===k?' aria-current="page"':''}><span class="ic">${ic}</span><span>${l}${k==='menu'&&S.menu.length?'<span class="badge">'+S.menu.length+'</span>':''}</span></button>`).join('');
  renderCook();
  const z=document.getElementById('zoek');
  if(z)z.oninput=e=>{S.q=e.target.value;aiNew=null;aiMsg='';render();const n=document.getElementById('zoek');n.focus();n.setSelectionRange(n.value.length,n.value.length);};
  const w=document.getElementById('winkel');
  if(w)w.onchange=e=>{if(S.land==='ES')S.winkelES=e.target.value;else S.winkel=e.target.value;save();};
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const d=b.dataset,a=d.act;
  if(a==='tab'){S.tab=d.v;window.scrollTo(0,0);}
  else if(a==='niveau'){S.niveau=+d.v;}
  else if(a==='eter'){S.eters[d.k]=Math.max(0,Math.min(12,S.eters[d.k]+ +d.d));}
  else if(a==='gv'){S.gv=!S.gv;}
  else if(a==='lc'){S.lc=!S.lc;}
  else if(a==='al'){S.allergie[d.k]=!S.allergie[d.k];}
  else if(a==='kit'){S.kit[d.k]=!S.kit[d.k];}
  else if(a==='vr'){S.voorraad[d.k]=!S.voorraad[d.k];}
  else if(a==='pit'){S.pitten=Math.max(1,Math.min(8,S.pitten+ +d.d));}
  else if(a==='mv'){const o=curOrder(),i=+d.i,j=i+ +d.d;[o[i],o[j]]=[o[j],o[i]];}
  else if(a==='land'){S.land=d.v;}
  else if(a==='pick'){S.menu=S.menu.includes(d.id)?S.menu.filter(x=>x!==d.id):S.menu.concat(d.id);}
  else if(a==='chk'){S.checked[d.k]=!S.checked[d.k];}
  else if(a==='reset'){if(!confirm('Menu en afvinkjes wissen?'))return;S.menu=[];S.checked={};S.tab='menu';}
  else if(a==='cook'){openCook(d.id);return;}
  else if(a==='modus'){S.modus=d.v;}
  else if(a==='fk'){S.fk=d.v;}
  else if(a==='fg'){S.fg=d.v;}
  else if(a==='gang'){S.gangen[d.g]=S.gangen[d.g]===d.id?null:d.id;}
  else if(a==='gang-lijst'){gangPlan().forEach(r=>{if(!S.menu.includes(r.id))S.menu.push(r.id)});S.tab='lijst';window.scrollTo(0,0);}
  else if(a==='gang-kook'){const p=gangPlan().map(r=>r.id);if(p.length)openCook(p[0],p);return;}
  else if(a==='ck-next'){S.cook.step++;}
  else if(a==='ck-prev'){S.cook.step=Math.max(0,S.cook.step-1);}
  else if(a==='ck-close'){if(timers.some(t=>!t.done)&&!confirm('Er lopen nog timers. Toch stoppen?'))return;closeCook();}
  else if(a==='ck-timer'){startTimer(d.l,+d.s);return;}
  else if(a==='ck-tstop'){timers=timers.filter(t=>t.id!==+d.id);renderTimers();return;}
  else if(a==='mise'){mise[d.k]=!mise[d.k];renderCook();return;}
  else if(a==='rate'){S.log.push({id:S.cook.id,r:d.v,d:Date.now(),n:S.niveau});const nx=cookNext();if(nx){openCook(nx,S.cook.plan,true);return;}closeCook();S.tab='menu';}
  else if(a==='lvup'){S.niveau=Math.min(5,S.niveau+1);}
  else if(a==='zoekwis'){S.q='';aiNew=null;aiMsg='';}
  else if(a==='ai'){maakRecept();return;}
  else if(a==='del'){if(!confirm('Dit recept verwijderen?'))return;verwijderEigen(d.id);}
  else if(a==='share'){shareList();return;}
  save();render();
});

function shareList(){
  const items=buildList();let txt='Boodschappen '+curWinkel()+'\n';
  curOrder().forEach(a=>{const g=items.filter(x=>x.s===a&&!S.checked[x.k]);if(!g.length)return;
    txt+='\n'+a+'\n'+g.map(x=>{const e=S.land==='ES'&&esInfo(x);return '- '+x.n+(e?' ('+e.es+')':'')+': '+buyText(x).buy;}).join('\n')+'\n';});
  if(navigator.share)navigator.share({title:'Boodschappen',text:txt}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>alert('Lijst gekopieerd.'),()=>alert(txt));
  else alert(txt);
}

function ensureAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();}catch(e){}}
function alarm(){
  try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400]);}catch(e){}
  if(!audio)return;
  try{const t0=audio.currentTime;for(let k=0;k<3;k++){const o=audio.createOscillator(),g=audio.createGain();
    o.frequency.value=880;o.connect(g);g.connect(audio.destination);
    g.gain.setValueAtTime(0.25,t0+k*0.5);g.gain.exponentialRampToValueAtTime(0.001,t0+k*0.5+0.35);
    o.start(t0+k*0.5);o.stop(t0+k*0.5+0.4);}}catch(e){}
}

const STOP=new Set('ik wil iets met een soort de het van en voor graag lekker maken wat recept recepten gerecht zin in op of die dat heb hebben we wij vanavond eten iets eens nog ook te om er uit mag moet kan something'.split(' '));
const SYN={
  pasta:['pasta','penne','spaghetti','macaroni','tagliatelle','lasagne','fusilli','farfalle','orzo','gnocchi'],
  noedels:['noedel','mie','mienest','rijstnoedel'],
  vis:['vis','zalm','garnaal','garnalen','kabeljauw','tonijn','pangasius','kibbeling'],
  kip:['kip','kipfilet','kipdij','kipdijfilet'],
  vlees:['vlees','gehakt','rundergehakt','spek','rookworst','kip','biefstuk','worst'],
  gehakt:['gehakt','rundergehakt'],
  rijst:['rijst','risotto','nasi','bloemkoolrijst'],
  aardappel:['aardappel','aardappelen','krieltjes','hutspot'],
  soep:['soep'],ei:['ei','eieren','omelet','quiche'],
  kaas:['kaas','feta','mozzarella','parmezaan','gruyère','mascarpone'],
  toetje:['__na'],dessert:['__na'],nagerecht:['__na'],zoet:['__na'],
  voorgerecht:['__voor'],hoofdgerecht:['__hoofd'],avondeten:['__hoofd'],
  ovenschotel:['oven'],oven:['oven'],thermomix:['thermomix'],tm5:['thermomix']
};
function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ');}
function zoekScore(r,q){
  const hay=norm([r.t,r.k,GL[r.g]].concat(r.i.map(x=>x.n+' '+(x.gfAlt?x.gfAlt.n:'')+' '+(x.lcAlt?x.lcAlt.n:''))).concat(r.e).join(' '));
  const toks=norm(q).split(/\s+/).filter(t=>t.length>1&&!STOP.has(t));
  if(!toks.length)return 1;
  let score=0,ct=0,ch=0;
  for(const t of toks){
    if(t.startsWith('snel')){if(r.min<=20)score++;else return 0;continue;}
    if(t.startsWith('makkelijk')||t.startsWith('simpel')){if(r.l===1)score++;else return 0;continue;}
    if(t==='vega'||t==='vegetarisch'){if(r.i.every(x=>x.s!==V&&!/worst|spek/i.test(x.n)))score++;else return 0;continue;}
    if(t==='glutenvrij'||t==='koolhydraatarm')continue;
    const words=SYN[t]||[t];
    const hit=words.some(w=>w.startsWith('__')?r.g===w.slice(2):hay.includes(norm(w)))||(t.length>4&&hay.includes(t.slice(0,-1)));
    ct++;if(hit){score+=2;ch++;}
  }
  return ct&&!ch?0:score;
}

function valideer(j){
  if(!j||!j.titel||!Array.isArray(j.ingredienten)||!Array.isArray(j.stappen))return null;
  const kitKeys=APPARATEN.concat(GEREI).map(x=>x[0]);
  const i=j.ingredienten.slice(0,20).map(x=>{
    const o={n:String(x.naam||'').slice(0,60),q:+x.hoeveelheid||0,u:['g','ml','st'].includes(x.eenheid)?x.eenheid:'g',
      s:AFD.includes(x.afdeling)?x.afdeling:P,pk:Math.max(+x.verpakking||0,0.25)};
    if(o.u!=='st'&&o.pk<5)o.pk=Math.max(o.q,5);
    if(x.glutenvrij===false)o.gf=false;
    if(x.koolhydraatarm===false)o.lc=false;
    if(x.checkGluten)o.gfNote=true;
    if(x.naam_es)o.es=String(x.naam_es).slice(0,60);
    if(Array.isArray(x.allergenen)){const al=x.allergenen.filter(a=>ALLERGENEN.some(z=>z[0]===a));if(al.length)o.al=al;}
    return o;}).filter(x=>x.n&&x.q>0);
  const stap=j.stappen.slice(0,20).map(st=>{
    const o={t:String(st.tekst||'').slice(0,400)};
    if(st.uitleg)o.u=String(st.uitleg).slice(0,400);
    if(+st.timer_sec>0){o.timer=Math.round(+st.timer_sec);o.tl=String(st.timer_label||'Timer').slice(0,20);}
    const tm=st.thermomix;
    if(tm&&tm.tijd)o.tm={tijd:String(tm.tijd),temp:tm.temp?String(tm.temp):'',sn:String(tm.snelheid||''),links:!!tm.linksom};
    return o;}).filter(o=>o.t);
  if(!i.length||!stap.length)return null;
  const r={id:'ai'+Date.now().toString(36),ai:true,t:String(j.titel).slice(0,70),k:String(j.keuken||'Overig').slice(0,20),
    g:['voor','hoofd','na'].includes(j.gang)?j.gang:'hoofd',l:Math.min(5,Math.max(1,Math.round(+j.niveau||1))),
    min:Math.max(5,Math.round(+j.minuten||30)),pt:Math.min(8,Math.max(0,Math.round(+j.kookpitten||0))),
    e:(Array.isArray(j.apparatuur)?j.apparatuur:[]).filter(k=>kitKeys.includes(k)),
    p:(Array.isArray(j.voorraad)?j.voorraad:[]).filter(k=>VOORRAAD[k]),i,stap};
  if(j.vooraf)r.vooraf=String(j.vooraf).slice(0,40);
  if(r.e.includes('thermomix'))r.tmMax=4;
  return r;
}

  vis:/\bvis|zalm|tonijn|kabeljauw|ansjovis|makreel|pangasius|koolvis|forel|haring|sardien|sardine|tilapia|\bheek|\bschol\b|zeebaars|dorade|surimi|kibbeling|vissaus|worcester|caesar|bonito|dashi/,
  schaaldieren:/garnaal|garnalen|gamba|scampi|kreeft|krab|langoustine|trassi|terasi|badjak|kroepoek/,
  weekdieren:/mossel|inktvis|octopus|calamari|oester|sint jakob|coquille|slak|oestersaus/,
  ei:/\bei\b|\beieren|eiwit|eigeel|mayonaise|\bmayo\b|\bmie\b|mienest|lange vingers|cocktailsaus|eiernoedel|omelet/,
  melk:/(?<!kokos)melk|boter|kaas|feta|mozzarella|parmez|gruyere|mascarpone|(?<!kokos)room|kwark|yoghurt|creme fraiche|ricotta|burrata|halloumi|kefir|pesto/,
  pinda:/pinda|satesaus|sate saus/,
  noten:/\bnoot|noten|walnoot|cashew|amandel|hazelno|pecan|pistache|pijnboompit|pesto|macadamia/,
  soja:/soja|tamari|ketjap|kecap|tofu|tempeh|edamame|miso|satesaus|teriyaki|hoisin/,
  selderij:/selderij|bouillon|soepgroente/,
  mosterd:/mosterd|cocktailsaus|mayonaise/,
  sesam:/sesam|tahin|hummus/,
  sulfiet:/wijn|balsamico|azijn|sherry/,
  lupine:/lupine/
};
const SAMENGESTELD=/saus|bouillon|pesto|worst|deeg|chocolade|mix|wrap|koek|vingers|kroepoek|sambal|ketjap|stokbrood|brood|noedel|mie/;
function actieveAllergieen(){return ALLERGENEN.map(x=>x[0]).filter(k=>S.allergie&&S.allergie[k]);}
function alLabel(k){return (ALLERGENEN.find(x=>x[0]===k)||[k,k])[1];}
function allergenenVan(x){
  const n=norm(x.n||''),out=new Set(x.al||[]);
  Object.entries(AL_KW).forEach(([k,re])=>{if(re.test(n))out.add(k);});
  return [...out];
}

function esInfo(x){
  if(x.es)return {es:x.es};
  const v=ES[x.n];if(!v)return null;
  return typeof v==='string'?{es:v}:v;
}
function esLine(x){
  if(S.land!=='ES')return '';
  const e=esInfo(x);if(!e)return '';
  return `<span class="sub es">${esc(e.es)}</span>`+(e.tip?`<span class="sub warn">${esc(e.tip)}</span>`:'');
}
